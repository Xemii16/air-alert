name: Android & Wear CI

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'wear/**'
      - 'shared/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/ci-android.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'wear/**'
      - 'shared/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/ci-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Test & Build Phone + Wear APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set; FCM will not work in the built APK until app/google-services.json is provided."
          fi

      - name: Run unit tests and assemble debug APKs
        run: ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :wear:assembleDebug --no-daemon

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 7
