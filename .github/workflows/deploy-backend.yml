name: Deploy Backend to GCP Compute Engine

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-gce
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run backend tests and build bootJar
        run: ./gradlew :backend:test :backend:bootJar --no-daemon

      - name: Package executable JAR
        run: |
          mkdir -p dist
          JAR_FILE=$(find backend/build/libs -maxdepth 1 -name 'backend-*.jar' ! -name '*-plain.jar' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "Executable bootJar not found!"
            exit 1
          fi
          cp "$JAR_FILE" dist/air-alert-backend.jar

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: air-alert-backend-jar
          path: dist/air-alert-backend.jar
          retention-days: 5

  deploy:
    name: Deploy to Compute Engine
    needs: build-and-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: air-alert-backend-jar
          path: dist

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Prepare staging directory on VM
        run: |
          gcloud compute ssh "${{ secrets.GCE_INSTANCE_NAME }}" \
            --zone="${{ secrets.GCE_ZONE }}" \
            --quiet \
            --command="rm -rf /tmp/air-alert-deploy && mkdir -p /tmp/air-alert-deploy"

      - name: Copy JAR and deploy files to VM
        run: |
          gcloud compute scp \
            --zone="${{ secrets.GCE_ZONE }}" \
            --quiet \
            dist/air-alert-backend.jar \
            deploy/air-alert-backend.service \
            deploy/backend.env.example \
            deploy/deploy-vm.sh \
            "${{ secrets.GCE_INSTANCE_NAME }}:/tmp/air-alert-deploy/"

      - name: Run deployment script on VM
        run: |
          gcloud compute ssh "${{ secrets.GCE_INSTANCE_NAME }}" \
            --zone="${{ secrets.GCE_ZONE }}" \
            --quiet \
            --command="sed -i 's/\r$//' /tmp/air-alert-deploy/deploy-vm.sh /tmp/air-alert-deploy/air-alert-backend.service /tmp/air-alert-deploy/backend.env.example && chmod +x /tmp/air-alert-deploy/deploy-vm.sh && /tmp/air-alert-deploy/deploy-vm.sh"
